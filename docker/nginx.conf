server {
    listen 80;
    root /usr/share/nginx/html;

    # /api/<module>/... is forwarded to that module's service with the prefix removed,
    # e.g. /api/auth/auth/login -> http://auth:4001/auth/login
    location /api/auth/      { proxy_pass http://auth:4001/; }
    location /api/students/  { proxy_pass http://student:4002/; }
    location /api/incidents/ { proxy_pass http://incident:4003/; }
    location /api/cases/     { proxy_pass http://case:4004/; }
    location /api/reports/   { proxy_pass http://report:4005/; }
    location /api/analytics/ { proxy_pass http://analytics:4006/; }

    # React Router: every other path loads the app
    location / {
        try_files $uri /index.html;
    }
}
